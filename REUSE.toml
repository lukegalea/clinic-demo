version = 1

# This repository predates REUSE and carries no inline SPDX headers, so a
# single blanket annotation declares every file (source, config, assets,
# dotfiles) at once.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Luke Galea"
SPDX-License-Identifier = "MIT"

# Spike-0's labelled items, replay fixtures and results are synthetic and
# dedicated to the public domain, so anyone may reuse them as evaluation data.
[[annotations]]
path = "priv/fixtures/system_one/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Luke Galea"
SPDX-License-Identifier = "CC0-1.0"
