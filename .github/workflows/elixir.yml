# These checks are the ones ash-project's shared `ash-ci.yml` runs, written out
# here instead of called.
#
# The shared workflow's credo job declares `permissions: security-events: write`
# — and a job-level permissions block *replaces* the default set rather than
# adding to it, so that job's token has no `contents: read`. On a public repo
# actions/checkout needs no token and nobody notices; on a private one it fails
# with "Repository not found", and a caller cannot grant back a permission the
# called workflow dropped. So the shared workflow only stays green while this
# repository stays public; this copy keeps working either way.
#
# Keep this file in step with upstream when adopting new checks. Its Credo SAST
# upload is deliberately omitted: code scanning uploads need GitHub Advanced
# Security, which private repositories do not have by default.

name: Elixir CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
          PGTZ: UTC
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
      # The `mix test` alias runs `ash.setup --quiet` (create + migrate)
      # itself, so there is no setup task here.
      - run: mix test

  # The standing visual/behavioral regression gate (test/visual/). Three
  # incidents — wiped static assets, dead Tailwind classes, an unconsumed
  # framework skin — all passed the Elixir-only checks above; this job boots
  # the real app and asserts what a browser actually renders. Required: a
  # red line here is a user-visible regression, never an allowed-to-fail.
  #
  # The suite owns its own readiness waits (node run.mjs polls the app first),
  # but the curl loop keeps the failure attribution obvious when the server
  # itself never comes up. The boot is the repo's convention: MIX_ENV=test
  # (workflow-level) with the runtime PHX_SERVER/PORT overrides; the agent
  # and OpenRouter paths degrade gracefully without API keys and the suite
  # asserts what renders, not model answers.
  visual:
    name: visual regression suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
          PGTZ: UTC
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
      - name: Set up the database and the seed catalog
        run: |
          set -euo pipefail
          mix ash.setup --quiet
          mix seed
      - name: Build the static assets
        run: |
          set -euo pipefail
          # The esbuild bundle resolves the a2ui lit elements, bpmn-js/dmn-js
          # and mermaid from assets/node_modules (NODE_PATH in config.exs) —
          # gitignored, so CI has to install from the committed lockfile.
          npm ci --prefix assets
          mix assets.setup
          mix assets.build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Playwright suite
        working-directory: test/visual
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Boot the app under test
        run: |
          set -euo pipefail
          MIX_ENV=test PHX_SERVER=true PORT=4000 mix phx.server > /tmp/phx-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/ > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4000/ > /dev/null
      - name: Run the visual suite
        working-directory: test/visual
        run: |
          set -euo pipefail
          node run.mjs --base-url http://127.0.0.1:4000
      - name: Dump the server log
        if: failure()
        run: tail -n 200 /tmp/phx-server.log 2>/dev/null || echo "(no server log — the boot step never ran)"
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-suite-failures
          path: test/visual/__screenshots__/
          if-no-files-found: ignore

  compile-test:
    name: MIX_ENV=test mix compile --warnings-as-errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
      - run: mix compile --force --warnings-as-errors

  compile-dev:
    name: MIX_ENV=dev mix compile --warnings-as-errors
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev
      # dev is where the dev-only `ash_agent_tools` introspection tooling
      # compiles, so its warnings surface here too.
      - run: mix compile --force --warnings-as-errors

  format:
    name: mix format --check-formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
      - run: mix format --check-formatted

  credo:
    name: mix credo --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
      - run: mix credo --strict

  dialyzer:
    name: mix dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev
      # No plt_file is configured, so dialyxir keeps the PLT under _build —
      # already restored by the setup action's cache, keyed by mix.lock.
      - run: mix dialyzer --format short

  docs:
    name: mix docs
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev
      - run: mix docs

  unused-deps:
    name: mix deps.unlock --check-unused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
      - run: mix deps.unlock --check-unused

  audit:
    name: mix deps.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: ./.github/actions/setup-elixir
      - run: mix deps.audit

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Private git deps (ash_compliance, ash_rules) are fetched by mix with
      # this PAT. A composite action cannot read the secrets context, so the
      # git rewrite lives here, ahead of the setup action's `mix deps.get`.
      - name: Give mix access to private git deps
        env:
          PRIVATE_DEPS_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: fsfe/reuse-action@v6
