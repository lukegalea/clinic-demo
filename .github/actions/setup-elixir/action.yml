name: Set up Elixir
description: >
  Installs the pinned Erlang/Elixir pair, restores the dependency and build
  cache for the requested MIX_ENV, and fetches dependencies.

inputs:
  mix-env:
    description: The MIX_ENV to fetch and build for.
    required: false
    default: test

runs:
  using: composite
  steps:
    # Rule publishing (ClinicDemo.Rules.install!) validates the DMN/BPMN XML
    # through xmllint; the runners do not ship it.
    - name: Install xmllint
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

    - uses: erlef/setup-beam@v1.24.1
      with:
        # Pinned to the minor rather than the patch so a missing prebuilt
        # image for one patch release cannot break CI. Elixir 1.20: the app
        # uses 1.20 regex modifiers and its boxic_* deps require ~> 1.20.
        otp-version: "27"
        elixir-version: "1.20"

    # The runner image goes in the cache key: _build holds NIFs and ports
    # (erlexec's exec-port) linked against the image's glibc, and the visual
    # job pins ubuntu-24.04 while the rest run ubuntu-latest (26.04). Sharing
    # one key let a 26.04 build land on 24.04, where exec-port fails with
    # "GLIBC_2.42 not found".
    - name: Name the runner image
      id: image
      shell: bash
      run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6.1.0
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-${{ steps.image.outputs.os }}-mix-${{ inputs.mix-env }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.image.outputs.os }}-mix-${{ inputs.mix-env }}-

    - name: Install hex and rebar
      shell: bash
      run: |
        mix local.hex --force
        mix local.rebar --force

    - name: Fetch dependencies
      shell: bash
      env:
        MIX_ENV: ${{ inputs.mix-env }}
      run: mix deps.get
